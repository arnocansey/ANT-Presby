version: '3.8'

# Required: DB_USER, DB_PASSWORD, JWT_SECRET and JWT_REFRESH_SECRET (put them in a .env file next to this
# compose file; never commit it). No credentials have defaults here.
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: antpress_db
    environment:
      POSTGRES_DB: ${DB_NAME:-antpress}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Base schema is applied once, when the data volume is first created.
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:?Set DB_USER in .env}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antpress_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-antpress}?schema=public
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-antpress}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser only calls the frontend's own /api proxy, which reaches the backend over the compose network.
        NEXT_PUBLIC_API_URL: http://backend:5000/api
    container_name: antpress_frontend
    environment:
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
